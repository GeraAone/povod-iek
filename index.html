<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Повод для IEK</title><meta name="description" content="Кому продать на этой неделе: щитовые, автоматика и электромонтаж Москвы и МО с поводом для закупки"><meta property="og:title" content="Повод для IEK"><meta property="og:description" content="Кому продать на этой неделе: щитовые, автоматика и электромонтаж Москвы и МО с поводом для закупки"><meta property="og:type" content="website"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%234c7fca'/%3E%3Crect x='9' y='9' width='5' height='5' rx='1' fill='%23fff' fill-opacity='.85'/%3E%3C/svg%3E"></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Explee-style. Dark start screen → light workspace: agent log on the left, step rail on top, canvas in the middle.
   Palette copied from Explee tokens; their emerald brand scale rotated to blue in OKLCH (same lightness and chroma). */
:root{
  --bg:#f8f8f8; --card:#ffffff; --fg:#0b0b0b; --fg2:#3a3a3a; --muted:#808080; --line:#00000014; --line2:#00000024; --soft:#0000000a; --inset:#eeeeee;
  --primary:#161616; --on-primary:#f8f8f8;
  --brand:#4c7fca; --brand-hi:#3e66a1; --brand-500:#5f9df8; --brand-50:#f4f9ff; --brand-100:#e5f0ff; --brand-200:#cde1ff; --brand-ink:#3e66a1;
  --amber:#ff8e00; --amber-ink:#a85d00; --amber-soft:#fff4e5; --red:#ff5956; --red-soft:#ffeceb;
  --shadow:0 1px 2px #0000000a,0 12px 32px #00000014;
  --f:"Geist","GeistSans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--brand-ink)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--fm);font-size:12px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
#app{height:100%}

/* ---------- start screen: light by default, layout as in Explee onboarding ---------- */
.night{--n-bg:var(--card);--n-card:var(--bg);--n-fg:var(--fg);--n-muted:var(--muted);--n-line:var(--line);--n-line2:var(--line2);min-height:100%;background:var(--n-bg);color:var(--n-fg);display:flex;flex-direction:column}
.night-top{display:flex;justify-content:space-between;align-items:center;padding-block:14px;padding-inline:18px;font-size:13px;color:var(--n-muted)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:-.02em}
.logo i{width:15px;height:15px;border-radius:4px;background:var(--brand);display:block;position:relative}
.logo i::after{content:"";position:absolute;right:3px;bottom:3px;width:5px;height:5px;border-radius:1px;background:#ffffffcc}
.night-main{flex:1;display:flex;justify-content:center;padding-block:40px 64px;padding-inline:16px}
.start{width:min(460px,100%);display:flex;flex-direction:column;gap:14px}
.start h1{font-size:27px;font-weight:600;letter-spacing:-.025em;margin:0;text-wrap:balance}
.start>p{margin:0;color:var(--n-muted);font-size:14.5px}
.start label{font-size:12.5px;color:var(--n-muted)}
.start .row{display:flex;gap:8px;flex-wrap:wrap}
.start input{flex:1 1 220px;min-width:0;background:var(--n-bg);border:1px solid var(--n-line2);border-radius:8px;padding:9px 12px;color:var(--n-fg)}
.start input:focus{outline:none;border-color:var(--brand-500)}
.feat{background:var(--n-card);border:1px solid var(--n-line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px;align-items:start}
.feat .ic{grid-row:span 2;width:30px;height:30px;border-radius:8px;background:var(--soft);display:grid;place-items:center}
.feat .ic svg{width:16px;height:16px}
.feat b{font-weight:600;font-size:14px}
.feat span{font-size:13px;color:var(--n-muted)}
.feats{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.start .note{font-size:12.5px;color:var(--n-muted)}
.night .btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--soft)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.brand:hover{background:var(--brand-hi);border-color:var(--brand-hi)}
.btn.dark{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:14px;height:14px;flex:none}

/* ---------- workspace ---------- */
.app{display:grid;grid-template-columns:284px minmax(0,1fr);height:100%}
.side{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{padding-block:14px 12px;padding-inline:16px;display:flex;flex-direction:column;gap:12px}
.proj{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.proj small{color:var(--muted);font-weight:400;margin-left:auto;font-family:var(--fm);font-size:11px}
.fav{width:24px;height:24px;border-radius:7px;background:var(--inset);display:grid;place-items:center;font-weight:600;font-size:11.5px;color:var(--fg2);flex:none}
.fav.b{background:var(--brand-100);color:var(--brand-ink)}
.side-log{flex:1;overflow:auto;padding-block:4px 14px;padding-inline:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.slabel{font:500 11.5px/1.3 var(--fm);color:var(--fg2);display:flex;gap:6px;align-items:center}
.slabel .ck{color:var(--brand-ink)}
.sblock{display:flex;flex-direction:column;gap:7px;animation:fadeup .4s ease both}
.sblock.still,.ln.still{animation:none}
.sblock h6{margin:0;font:600 10.5px var(--fm);letter-spacing:.07em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.slist{display:flex;flex-direction:column;gap:1px}
.slist button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:7px;padding:5px 8px;cursor:pointer;font-size:13px;color:var(--fg)}
.slist button:hover,.slist button.on{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.slist span{font:12px var(--fm);color:var(--muted)}
.slist .sb{display:block;height:3px;border-radius:2px;background:var(--brand-200);margin-top:3px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--fg2);display:flex;flex-direction:column;gap:6px}
.mini .hd{display:flex;gap:8px;align-items:center}
.mini .hd b{font-size:13px;color:var(--fg)}
.mini p{margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kvs{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:3px 10px;font-size:12.5px}
.kvs span{color:var(--muted)}
.kvs b{font:500 12px var(--fm);text-align:right}
.agent{border-top:1px solid var(--line);padding-block:12px 14px;padding-inline:16px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.agent .hd{font:500 11.5px var(--fm);color:var(--fg);display:flex;align-items:center;gap:8px}
.ln{font:11.5px/1.45 var(--fm);color:var(--muted);display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 4px;animation:fadeup .3s ease both}
.ln.ok{color:var(--fg2)}
.ln .ok-i,.ln .r{color:var(--brand-ink)}
.spin{width:10px;height:10px;border:1.5px solid var(--line2);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.side-foot{padding-block:10px;padding-inline:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;user-select:none;background:none;border:0;padding:0;color:var(--fg2)}
.toggle .sw{width:26px;height:15px;border-radius:999px;background:var(--line2);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--card);transition:transform .15s}
.toggle.on .sw{background:var(--brand)}
.toggle.on .sw::after{transform:translateX(11px)}

.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--card)}
.rail{display:flex;align-items:center;gap:14px 20px;padding-block:12px;padding-inline:24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.steps{display:flex;align-items:center;flex:1 1 420px;min-width:0}
.sp{display:flex;align-items:center;flex:1 1 auto;min-width:0}
.sp:last-child{flex:0 0 auto}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--fm);border:1px solid var(--line2);color:var(--muted);background:var(--card);flex:none;padding:0}
button.dot{cursor:pointer}
button.dot:disabled{cursor:default}
.sp.done .dot{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sp.view .dot{box-shadow:0 0 0 3px var(--brand-200)}
.cn{flex:1;height:1px;background:var(--line2);margin-inline:6px;position:relative;min-width:10px}
.cn i{position:absolute;inset:0;background:var(--primary);transform-origin:left;transform:scaleX(0);transition:transform .7s ease}
.cn.full i{transform:scaleX(1)}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:999px;padding:3px 11px 3px 8px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--card);flex:none;color:var(--fg)}
.pill .pd{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:pulse 1.6s infinite}
.pill.ready .pd{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 #4c7fca80}70%{box-shadow:0 0 0 7px #4c7fca00}100%{box-shadow:0 0 0 0 #4c7fca00}}
.next{display:flex;flex-direction:column;gap:5px}
.next h6{margin:0;font:600 10px var(--fm);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.nxs{display:flex;gap:6px}
.nx{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0 2px;min-width:58px;text-align:center;line-height:1.2}
.nx:disabled{cursor:default}
.nx.cur{color:var(--fg)}
.nx.cur .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.nx.seen .dot{border-color:var(--brand);color:var(--brand-ink)}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.canvas{flex:1;overflow:auto;padding-block:24px 96px;padding-inline:28px;min-height:0}
.inner{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vh h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance}
.vh p{margin:4px 0 0;color:var(--muted);max-width:72ch;font-size:13.5px}
.vh p b{color:var(--fg2);font-weight:500}
.eyebrow{font:500 11px var(--fm);color:var(--muted);margin:0 0 4px;letter-spacing:.02em}
.paused{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--brand-50);border:1px solid var(--brand-200);border-radius:10px;padding:8px 12px;font-size:13px;flex-wrap:wrap}

/* ---------- content blocks ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.h6{margin:0 0 8px;font:600 10.5px var(--fm);letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font:500 10.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.dim td{opacity:.6}
.co{display:flex;gap:10px;align-items:flex-start;min-width:170px}
.co b{display:block;font-weight:500}
.co small{font:11.5px var(--fm);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--fm);padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--fg2);white-space:nowrap}
.tag.b{background:var(--brand-100);color:var(--brand-ink)}
.tag.a{background:var(--amber-soft);color:var(--amber-ink)}
.tag.r{background:var(--red-soft);color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip small{opacity:.6;margin-left:4px;font-family:var(--fm)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dots i.f{background:var(--brand)}
.dots i.h{background:linear-gradient(90deg,var(--brand) 50%,var(--line2) 50%)}
.score{display:flex;align-items:center;gap:7px;white-space:nowrap}
.score b{font:600 12px var(--fm)}
.niche{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:var(--fg)}
.niche:hover{border-color:var(--brand)}
.niche h3{margin:0;font-size:14px;font-weight:600}
.niche .big{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.niche dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:12.5px}
.niche dt{color:var(--muted)}
.niche dd{margin:0}
.bar{height:5px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transform-origin:left;animation:grow .9s ease both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.feed{display:flex;flex-direction:column;gap:10px}
.trg{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.trg .d{font:500 11.5px var(--fm);color:var(--muted);padding-top:3px}
.trg h3{margin:6px 0 4px;font-size:14.5px;font-weight:600}
.trg p{margin:0;font-size:13.5px}
.trg .mean{color:var(--fg2);margin-top:6px}
.trg .mean b{font-weight:600;color:var(--fg)}
.linkbtn{background:none;border:0;padding:0;color:var(--fg);font-weight:500;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--brand-ink);text-decoration:underline}
.people{display:flex;flex-direction:column}
.person{display:grid;grid-template-columns:34px minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.person:last-child{border-bottom:0}
.person:hover{background:var(--soft)}
.ava{width:30px;height:30px;border-radius:50%;background:var(--inset);display:grid;place-items:center;font:600 11px var(--fm);color:var(--fg2)}
.person b{display:block;font-weight:500;font-size:13.5px}
.person small{color:var(--muted);font-size:12px}
.srcs{display:flex;flex-wrap:wrap;gap:4px}
.src{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--fm);padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.src.y{border-color:var(--brand-200);background:var(--brand-50);color:var(--brand-ink)}
.src.n{text-decoration:line-through;opacity:.7}
.res{font:12px/1.5 var(--fm);color:var(--fg2)}
.res .st{font-size:11px;color:var(--brand-ink)}
.res .st.a{color:var(--amber-ink)}
.fill{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.fill div{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.fill b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.legal{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13px;color:var(--fg);margin:0}
.msg-grid{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:14px}
.pick{display:flex;flex-direction:column;gap:4px;max-height:640px;overflow:auto}
.pick button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12.5px;color:var(--fg2)}
.pick button.on{border-color:var(--brand);background:var(--brand-50)}
.pick button b{display:block;font-size:13.5px;color:var(--fg);font-weight:500}
.mail{display:flex;flex-direction:column}
.mail .row2{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
.mail .row2>span:first-child{color:var(--muted)}
.script{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.script div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;font-size:13.5px}
.script em{font-style:normal;color:var(--muted);font:500 11px var(--fm);padding-top:3px}
.bubble{background:var(--brand-100);border-radius:14px 14px 14px 4px;padding:10px 14px;max-width:560px;white-space:pre-line;font-size:13.5px}
.note{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-line}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--soft);flex-wrap:wrap}
.tab{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tab.on{background:var(--primary);color:var(--on-primary)}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 10px;text-align:left;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--card);cursor:pointer;color:var(--fg)}
.opt.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.opt b{font-weight:600;font-size:14px}
.opt>span:last-child{grid-column:2;font-size:12.5px;color:var(--muted)}
.opt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);margin-top:2px}
.opt.on .rd{border:5px solid var(--brand)}
.amo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.amo-h{background:#22314a;color:#ffffff;padding:9px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.amo-b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

-21", "until": "2026-10-30", "url": "https://zakupki.gov.ru/epz/order/notice/ea20/view/common-info.html?regNumber=0373200008726000058", "src": "ЕИС, 44-ФЗ", "price": "0,5 млн ₽", "score": 0, "winner": null, "winnerName": null, "winnerInn": null, "more": 1}], "projectsTotal": 182, "projectsCust": 53, "projectsSrc": "B2B-Center, ЭТП Газпромбанка, ЕИС (через ГосПлан); Москва и область; собрано 24–25.11.2026", "contextMd": "# Контекст компании для «Повода»: IEK GROUP\n\nВерсия 0.2 от 25.11.2026 (0.1 — 24.11). Собрано со слов заместителя руководителя отдела продаж на встрече 24.11 (таймкоды записи в скобках). Разделы с пометкой «заполняем с менеджером» уточняются за неделю внедрения с менеджером канала.\n\n## 1. Что продаём\n\nНизковольтное оборудование для щитов и шкафов: автоматические выключатели, модульные устройства, корпуса, кабеленесущие системы. Бренды IEK, ITK, ONI. Система НКУ FORMAT PRO и типовые решения НКУ.\n\n## 2. Каналы\n\n| Канал | Как покупает | Статус в демо |\n|---|---|---|\n| Дистрибьюторы и дилеры | Основной объём. Дилеры перекупают у дистрибьюторов (11:17–12:04) | вне демо |\n| Конечные заказчики: заводы, госзаказчики, оборонка, эксплуатация зданий | Покупают через дистрибьюторов (11:17) | **в демо сегмент «Заказчики с проектом»**: проект, закупка, монтаж |\n| Производители НКУ (щитовики) | Прямой контракт с IEK, отдельный канал «профессиональных инсталляторов» (12:42) | **канал демо** |\n| Частные электрики | Сами выбирают дорогие линейки для частных объектов (33:46–35:15) | вне демо |\n\n## 3. Путь клиента в канале «производители НКУ»\n\n1. У заказчика появляется проект: новая производственная линия, реконструкция подстанции, ГРЩ в цехе, шкафы автоматизации (35:15–36:01).\n2. Вендоров и решения закладывают заказчик и проектный институт (36:01).\n3. Щитовик чаще собирает по проекту, на заложенном оборудовании. Продвинутый щитовик влияет как эксперт: «на этом бренде такую автоматизацию не соберёшь» (36:52–37:39).\n4. К моменту тендера всё уже решено: заказчик, проектный институт и поставщик (1:06:58–1:07:40).\n\n**Вывод для поводов:** самый ценный повод возникает на стадии проекта, раньше тендера. Найм у щитовика — только дополнительный сигнал (33:46).\n\n## 4. Признаки «у щитовика есть заказы» и их вес\n\n| Признак | Как меряем | Источник | Вес |\n|---|---|---|---|\n| Выигранные проекты и тендеры | число, суммы, заказчики за 6–12 месяцев (28:04, 1:01:34) | ЕИС 44-ФЗ и 223-ФЗ, коммерческие площадки, объекты на сайте | 3 |\n| Выручка растёт | 2025 год к 2024 (1:02:20) | ГИР БО | 2 |\n| Расширяют мощности | новая площадка или цех, рост основных средств, найм в производство (28:53) | региональные новости, ЕГРЮЛ, ГИР БО, hh.ru | 2 |\n| Участвуют в выставках | со своим оборудованием: значит, есть деньги на продвижение (1:02:20) | каталоги экспонентов | 1 |\n| Бренды и статусы | статусы у вендоров, бренды в вакансиях и на сайте | локаторы вендоров, сайт, hh.ru | 1 |\n| Нанимают в производство | роли сборки и проектирования | hh.ru | 1 |\n\nЗаполняем с менеджером: веса, пороги («сколько тендеров за полгода — это много»), ещё 5–10 признаков канала.\n\n## 5. Поводы по стадиям\n\n| Стадия | Пример | Кому звонить | Что предложить |\n|---|---|---|---|\n| Проект у заказчика | проектирование или реконструкция электроснабжения, стадия РД | заказчик, проектировщик | инструменты проектирования и типовые решения НКУ IEK, пока спецификация не написана |\n| Закупка оборудования | опросный лист на шкафы управления, автоматы для ВРУ | заказчик, дистрибьютор | IEK как основной вариант или эквивалент до срока подачи |\n| Монтаж щитов | подрядчик на ГРЩ, ВРУ, распределительные щиты | подрядчик-победитель | комплектация заказа |\n| Здоровье щитовика | признаки из раздела 4 | щитовик | статус сборщика, проектные условия |\n\nНе считаем поводом: только вакансию без признаков роста; «успеть до найма» в канале щитовиков (32:57–37:39).\n\n## 6. Площадки и источники\n\n| Источник | Что даёт | Доступ |\n|---|---|---|\n| B2B-Center | коммерческие закупки щитов и проектных работ | публичный поиск |\n| ЭТП Газпромбанка | коммерческие и 223-ФЗ закупки | публичный поиск, напрямую без VPN |\n| ЕИС (44-ФЗ, 223-ФЗ, капремонт домов по ПП РФ 615) | закупки щитов, ВРУ, КТП и сетей 0,4 кВ; победители закрытых закупок; подрядчики сетевых компаний; госконтракты щитовиков | через API ГосПлана; сам сайт ЕИС — с сертификатом Минцифры |\n| Фабрикант, Сбер-АСТ, Росэлторг, порталы крупных заказчиков | коммерческие тендеры | открываются напрямую; какие важны — заполняем с менеджером |\n| ГИР БО, ЕГРЮЛ | выручка, основные средства, адреса, руководители | открыто |\n| Каталоги выставок («Электро» и др.) | экспоненты | открыто |\n| Локаторы партнёров вендоров | статусы, контакты партнёров | Systeme Electric (API) и CHINT открыты; EKF и КЭАЗ публичного списка не дают |\n| hh.ru | найм, бренды в требованиях | открыто |\n\nЗаполняем с менеджером: какие площадки и порталы заказчиков реально смотрит канал, какие проектные институты ключевые.\n\n## 7. Как агент читает закупку\n\n| Что в закупке | Стадия | Кому звонить |\n|---|---|---|\n| ПИР, проектная или рабочая документация | Проект у заказчика | после итогов — проектировщику-победителю: он пишет спецификацию |\n| ПИР + СМР «под ключ» (сетевые компании: ТП-10/0,4 кВ, КЛ-0,4 кВ) | Проект у заказчика | подрядчикам, которые уже строят для заказчика; после итогов — победителю |\n| Поставка щитов, шкафов, ВРУ, КТП | Закупка оборудования | заказчику и дистрибьютору до срока подачи, после — поставщику-победителю |\n| Монтаж, замена, ремонт ВРУ и щитов | Монтаж щитов | до итогов — партнёрам-монтажникам IEK; после — подрядчику-победителю |\n\nНе берём: только высокая сторона (6–220 кВ без 0,4 кВ), обслуживание, измерения, общестрой (отделка, фасады), пожарные и информационные «щиты». Заполняем с менеджером: пороги цены и какие заказчики приоритетны.\n\n## 8. Исключения и правила\n\n- Текущих клиентов и партнёров IEK исключаем по списку из CRM.\n- Контакты только из открытых источников, у let T = null;

function tick(){
  clearTimeout(T);
  if(!S.playing || S.ready) return;
  const st = RUN[S.cur-1];
  if(S.li < st.lines.length){
    S.li++;
    if(S.view !== st.id){ S.view = st.id; drawMain(); }
    drawSide(); reveal(true);
    T = setTimeout(tick, DUR / S.speed); return;
  }
  S.done = S.cur;
  if(S.cur < RUN.length){ S.cur++; S.li = 0; S.view = RUN[S.cur-1].id; draw(); T = setTimeout(tick, 500 / S.speed); }
  else finish();
}
function finish(){
  clearTimeout(T); S.cur = RUN.length; S.done = RUN.length; S.li = RUN[RUN.length-1].lines.length;
  S.ready = true; S.playing = false; S.view = 'ready'; if(S.t0) S.took = Math.round((Date.now() - S.t0)/1000);

function reveal(anim){
  const main = document.getElementById('main'); if(!main) return;
  const st = RUN.find(r => r.id === S.view);
  const all = [...main.querySelectorAll('.rv')];
  const frac = (!st || !isLive(S.view)) ? 1 : S.li / st.lines.length;
  const target = Math.ceil(all.length * frac);
  let k = 0;
  all.forEach((el, i) => {
    if(i >= target || el.classList.contains('in')) return;
    const d = anim ? Math.min(k++, 14) * 70 : 0;
    el.style.transitionDelay = d + 'ms';
    el.classList.add('in');
    setTimeout(() => animateInside(el, anim), d);
  });
}
function animateInside(el, anim){
  el.querySelectorAll('[data-count]').forEach(n => countUp(n, anim));
  el.querySelectorAll('[data-type]').forEach(n => typeIt(n, anim));
}
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(n, anim){
  if(n.dataset.done) return; n.dataset.done = 1;
  const to = +n.dataset.count, suf = n.dataset.suf || '';
  if(!anim || reduced()){ n.textContent = fmtInt(to) + suf; return; }
  const t0 = performance.now(), dur = 700;
  const step = t => { const p = Math.min(1, (t - t0)/dur); n.textContent = fmtInt(Math.round(to * (1 - Math.pow(1-p, 3)))) + suf; if(p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function typeIt(n, anim){
  if(n.dataset.done) return; n.dataset.done = 1;
  const t = n.dataset.type;
  if(!anim || reduced()){ n.textContent = t; return; }
  let i = 0; n.classList.add('caret');
  const iv = setInterval(() => { i += 3; n.textContent = t.slice(0, i); if(i >= t.length){ clearInterval(iv); n.classList.remove('caret'); } }, 16);
}

function rejApply(){
  const r = S.rej, c = r && byId[r.id], R = r && REJ.find(x => x.k === r.why); if(!c || !R) return;

  if(R.k === 'client') S.clients.add(c.id); else S.rejected.add(c.id);
  S.rejWhy[c.id] = {why:R.t, term:r.term, d:todayDM()};
  S.okSet.delete(c.id); S.calib.push('no');
  let p = null;
  if(r.scope === 'okved' && c.okved){ const o = active().filter(x => x.okved === c.okved);
    p = {id:'p' + Date.now(), key:'okved:' + c.okved, kind:'okved', val:c.okved, label:c.okvedName || '', t:'Исключить ОКВЭД ' + c.okved + (c.okvedName ? ' «' + c.okvedName + '»' : ''),

  if(r.scope === 'type' && c.trig[0]){ const ty = c.trig[0].type, o = active().filter(x => x.trig.some(t => t.type === ty));
    p = {id:'p' + Date.now(), key:'type:' + ty, kind:'type', val:[ty], t:'Не считать поводом «' + (TT[ty] || ty) + '»',
      why:`Вы убрали «${c.name}» с причиной «Повод не про нас». Тот же повод ещё у ${o.length} ${plural(o.length,'компании','компаний','компаний')} в очереди.`}; }
  if(p && !S.props.some(x => x.key === p.key) && !S.propsDone.has(p.key)) S.props.unshift(p); else p = null;
  S.rej = null; S.drawer = null; recalc(); persist(); draw();

}

function slot(c){ const d = ['пн','вт','ср','чт','пт'][Math.floor(hash(c.id+'d')*5)]; return `${d}, ${10 + Math.floor(hash(c.id+'h')*7)}:00, встреча в цеху`; }
function simWeek(){
  // Симуляция по ориентиру пилота: на очередь около 24 компаний одна встреча. Это не прогноз.
  const left = queue().flat().filter(c => !S.outcomes[c.id]).sort((a,b) => hash(a.id+'w') - hash(b.id+'w'));
  const have = Object.values(S.outcomes).filter(o => o==='meet' || o==='kp').length;
  left.forEach((c,i) => { const r = hash(c.id+'r');
    if(have + i < 1) S.outcomes[c.id] = 'meet';
    else S.outcomes[c.id] = r < .58 ? 'nocall' : r < .90 ? 'sec' : r < .96 ? 'callback' : 'no'; });
}
V.calls = () => {

  const groups = {meet:[], kp:[], callback:[], no:[], sec:[], nocall:[]}; flat.forEach(c => { const o = S.outcomes[c.id]; if(o) groups[o].push(c); });
  const block = (k, title) => groups[k].length ? `<div class="card pad"><p class="h6">${esc(title)} · ${groups[k].length}</p><ul class="cl">${groups[k].map(c => `<li><span class="s">${k==='meet'||k==='kp' ? '●' : '○'}</span><span><button class="linkbtn" data-open="${c.id}">${esc(c.name)}</button> <span class="muted small">${esc(c.trig[0].title)}</span>${k==='meet' ? `<br><span class="small">${esc(slot(c))} · ${esc(MANAGERS[flat.indexOf(c) % MANAGERS.length])}</span>` : ''}</span></li>`).join('')}</ul></div>` : '';
  return head('', 'Звонки и встречи', '',
    `<div class="row"><button class="btn brand" data-act="sim-week" ${done < total ? '' : 'disabled'}>Прокрутить неделю (симуляция)</button>${Object.keys(S.outcomes).length ? '<button class="btn ghost sm" data-act="reset-week">Сбросить</button>' : ''}</div>`) +

    ${(c.sig||[]).length || (c.group||[]).length ? `<section><h4>Признаки</h4><ul class="flags">${(c.sig||[]).map(x => `<li class="ok"><span class="ic">◆</span><span>${esc(x.t)}<br><span class="small muted">${esc(x.d)} · ${esc(x.src)}</span></span></li>`).join('')}${(c.group||[]).map(x => `<li class="ok"><span class="ic">◇</span><span>Группа компаний: ${esc(x)}<br><span class="small muted">ЕГРЮЛ и «Прозрачный бизнес» ФНС</span></span></li>`).join('')}</ul></section>` : ''}

      ${(c.contacts || []).length ? c.contacts.map(x => `<dt>${esc(x.kind)}</dt><dd><span class="mono">${esc(x.v)}</span> <span class="tag ${x.lvl === 'two' ? 'ok' : x.lvl === 'doubt' ? 'a' : ''}">${x.lvl === 'two' ? 'совпадает в ' + x.srcs.length + ' источниках' : x.lvl === 'doubt' ? 'под вопросом' : '1 источник'}</span><br><span class="srcnote">${esc(x.srcs.join(', '))}</span></dd>`).join('') : `<dt>Телефоны</dt><dd class="mono">${c.phones.length ? c.phones.map(esc).join('<br>') + ' <span class="srcnote">сайт</span>' : '—'}</dd>
      <dt>Почта</dt><dd class="mono">${c.emails.length ? c.emails.map(esc).join('<br>') : '—'}</dd>`}
      <dt>Мессенджеры</dt><dd>${c.msgr.length ? esc(c.msgr.join(', ')) + ' <span class="srcnote">сайт</span>' : '—'}</dd>
      ${c.siteRead || c.scouted ? '' : '<dt>Сайт</dt><dd class="muted">не прочитан</dd>'}</dl>
      <p class="small muted" style="margin:8px 0 0">Только открытые источники, у каждого контакта ссылка: менеджер видит, откуда номер, и может ответить на «откуда у вас мой номер». Не тот контакт — исправляем за рабочий день. Попросили не звонить — номер в стоп-листе.</p></section>
    ${c.fit ? `<div class="row">${S.rejected.has(c.id) ? `<button class="btn" data-unreject="${c.id}">Вернуть в список</button>` : `<button class="btn okbtn ${S.okSet.has(c.id) ? 'on' : ''}" data-ok="${c.id}" aria-pressed="${S.okSet.has(c.id)}">✓ Позвонил бы как есть</button><button class="btn" data-reject-now="${c.id}">Не наш…</button>`}${S.ready && c.trig.length ? `<button class="btn brand" data-view="cards" data-msgco="${c.id}">Письмо и звонок ${ICON.arrow}</button>` : ''}</div>` : ''}
  </aside>`;
}

/* ---------- события ---------- */
const toggleSet = (set, k) => { set.has(k) ? set.delete(k) : set.add(k); return set.has(k); };
document.addEventListener('submit', e => {
  if(e.target.id === 'steerForm'){ e.preventDefault(); const v = (document.getElementById('steerIn').value || '').trim(); S.steerText = ''; if(v) steer(v); return; }
  if(e.target.id !== 'startForm') return;
  e.preventDefault();
  const v = (document.getElementById('siteIn').value || '').trim();
  if(v && v !== CL.site) toast(`В демо разбор собран для ${CL.site}`);
  startRun();
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-act],[data-open],[data-nichego],[data-tf],[data-reject],[data-reject-now],[data-unreject],[data-crm],[data-msg],[data-riskf],[data-delstep],[data-delx],[data-delcrit],[data-tab],[data-call],[data-out],[data-conn],[data-src],[data-cmd],[data-ok],[data-pacc],[data-pdec],[data-rwhy],[data-rscope],[data-rterm],[data-xdel],[data-okvdel],[data-xadel],[data-csdel],[data-deliv],[data-freq],[data-watch]');
  if(!t) return;
  const d = t.dataset;
  if(d.msgco) S.msgCo = d.msgco;
  if(d.view){ go(d.view); return; }
  if(d.open){ S.drawer = d.open; drawLayer(); return; }
  if(d.nichego){ S.f.niche = d.nichego; persist(); if(S.ready){ S.tab = 'companies'; go('ready'); } else if(S.done >= 4) go('search'); else toast('Компании появятся на шаге 4'); return; }
  if(d.tab){ S.tab = d.tab; drawMain(); return; }
  if(d.conn){ const k = d.conn; S.conn.has(k) ? S.conn.delete(k) : S.conn.add(k); persist(); draw(); if(S.conn.has(k)) toast('В пилоте подключаем по вашему ключу API'); return; }
  if(d.call){ S.call = d.call; drawLayer(); return; }
  if(d.out){ S.outcomes[d.id] = d.out; S.call = null; drawMain(); drawLayer(); persist(); toast('Исход записан: ' + OUT[d.out].t); return; }
  if(d.delcrit != null){ const k = S.custom[+d.delcrit]; S.custom.splice(+d.delcrit, 1); if(k) logCtx(`Убрали свой признак «${k.t}»`); recalc(); persist(); draw(); return; }
  if(d.tf){ S.trig = d.tf; drawMain(); return; }
  if(d.reject || d.rejectNow){ S.rej = {id:d.reject || d.rejectNow, why:null, scope:'one', term:'ever'}; drawLayer(); return; }
  if(d.rwhy){ if(S.rej){ S.rej.why = d.rwhy; S.rej.scope = 'one'; } drawLayer(); return; }
  if(d.rscope){ if(S.rej) S.rej.scope = d.rscope; drawLayer(); return; }
  if(d.rterm){ if(S.rej) S.rej.term = d.rterm; drawLayer(); return; }
  if(d.unreject){ S.rejected.delete(d.unreject); delete S.rejWhy[d.unreject]; recalc(); persist(); draw(); return; }
  if(d.crm){ S.crm = d.crm; drawMain(); return; }
  if(d.msg){ S.msgCo = d.msg; S.edit = null; drawMain(); return; }
  if(d.riskf){ S.f.risk = d.riskf; persist(); drawMain(); drawSide(); toast(d.riskf === 'all' ? 'Риски не убираем из очереди' : `В очереди ${qn()} компаний`); return; }
  if(d.delstep){ const c = byId[S.msgCo]; S.scripts[c.id] = (S.scripts[c.id] || baseScript(c)).filter((_,i) => i !== +d.delstep); persist(); drawMain(); return; }
  if(d.delx){ S.extra.splice(+d.delx, 1); persist(); drawMain(); return; }
  if(d.src){ const s = SRC.find(x => x.k === d.src); if(!s) return; const before = qSnap(), isOn = toggleSet(S.src, d.src);
    logCtx(`Площадка «${SN[d.src]}»: ${isOn ? 'включена' : 'выключена'}`); recalc(); persist(); draw();
    toast(s.st === 'demo' ? `${SN[d.src]}: ${isOn ? 'включено' : 'выключено'}. ${qMsg(before)}` : `${SN[d.src]}: ${isOn ? 'подключим' : 'не подключаем'} в пилоте, в демо данных нет`); return; }
  if(d.cmd){ const c = CMDS.find(x => x.k === d.cmd); if(c) steer(c.t, c); return; }
  if(d.ok){ const id = d.ok;
    if(S.okSet.has(id)){ S.okSet.delete(id); toast('Отметку сняли'); }
    else { S.okSet.add(id); S.calib.push('ok');
      if(!S.calibDone && streak() >= 3){ S.calibDone = true; logCtx('Калибровка пройдена: три карточки подряд «позвонил бы как есть»'); toast('Калибровка пройдена: три карточки подряд совпали с вашим взглядом'); }
      else toast(S.calibDone ? 'Принято: позвонили бы как есть' : `Принято: ${Math.min(streak(), 3)} из 3 подряд`); }
    persist(); drawMain(); drawLayer(); drawSide(); return; }
  if(d.pacc){ acceptProp(d.pacc); return; }
  if(d.pdec){ const p = S.props.find(x => x.id === d.pdec); S.props = S.props.filter(x => x.id !== d.pdec); if(p) S.propsDone.add(p.key); persist(); draw(); toast('Отклонено: агент не будет предлагать это снова'); return; }
  if(d.xdel != null){ const i = +d.xdel, off = toggleSet(S.exOff, i); logCtx(`Правило «${EXC[i]}»: ${off ? 'снято' : 'вернули'}`); persist(); drawMain(); toast(off ? 'Правило снято. В пилоте агент перечитает закупки без него' : 'Правило вернули'); return; }
  if(d.okvdel){ const before = qSnap(); S.exOkved.delete(d.okvdel); S.propsDone.delete('okved:' + d.okvdel); logCtx(`Вернули компании с ОКВЭД ${d.okvdel}`); recalc(); persist(); draw(); toast(`Вернули. ${qMsg(before)}`); return; }
  if(d.xadel != null){ const before = qSnap(), w = S.exAdd[+d.xadel]; S.exAdd.splice(+d.xadel, 1); logCtx(`Сняли исключение по словам «${w}»`); recalc(); persist(); draw(); toast(`${qMsg(before)}`); return; }
  if(d.csdel != null){ S.srcCustom.splice(+d.csdel, 1); persist(); drawMain(); return; }
  if(d.deliv){ toggleSet(S.deliv, d.deliv); persist(); drawMain(); drawSide(); return; }
  if(d.freq){ toggleSet(S.freq, d.freq); persist(); drawMain(); return; }
  if(d.watch){ const isOn = toggleSet(S.watch, d.watch); if(d.watch === 'own' && isOn && !S.clients.size) toast('Загрузите ИНН клиентов на шаге 1: агент будет ловить у них поводы для допродажи'); persist(); drawMain(); return; }
  switch(d.act){
    case 'play':
      if(S.ready) break;
      S.playing = !S.playing;
      if(S.playing){ S.view = RUN[S.cur-1].id; drawSide(); drawTop(); drawMain(); T = setTimeout(tick, 400 / S.speed); }
      else { clearTimeout(T); drawSide(); drawTop(); drawMain(); }
      break;
    case 'speed': S.speed = S.speed === 1 ? 2 : (S.speed === 2 ? 4 : 1); drawTop(); break;
    case 'skip': finish(); break;
    case 'restart': clearTimeout(T); S.phase = 'start'; S.ready = false; S.done = 0; S.cur = 1; S.li = 0; S.view = 'icp'; S.playing = false; S.drawer = null; persist(); draw(); break;
    case 'show-out': S.showOut = !S.showOut; drawMain(); break;
    case 'close-call': S.call = null; drawLayer(); break;
    case 'sim-week': simWeek(); S.week = true; drawMain(); persist(); break;
    case 'ctx-dl': { const b = new Blob([ctxText()], {type: 'text/markdown'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'context.md'; document.body.appendChild(a); a.click(); a.remove(); break; }
    case 'go-projects': S.f.niche = 'proj'; persist(); if(S.ready){ S.tab = 'companies'; go('ready'); } else toast('Заказчики появятся, когда агент закончит'); break;
    case 'reset-week': S.outcomes = {}; S.week = false; drawMain(); persist(); break;
    case 'sample-clients': fitAll.filter(c => c.known).forEach(c => S.clients.add(c.id)); recalc(); draw(); persist(); toast('Исключили контрагентов IEK, найденных в СПАРК'); break;
    case 'clear-clients': S.clients.clear(); recalc(); draw(); persist(); break;
    case 'sig-mchs': S.f.kw = 'пожарной безопасности'; S.f.reg = 'all'; persist(); S.tab = 'companies'; go(S.ready ? 'ready' : 'search'); toast('Фильтр: лицензия МЧС'); break;
    case 'add-crit': {
      const tt = (document.getElementById('cc-t').value || '').trim(), kw = (document.getElementById('cc-kw').value || '').trim(), w = document.getElementById('cc-w').value;
      if(!kw){ toast('Нужны слова через запятую'); break; }
      S.custom.push({t: tt || kw, kw, w, on: true}); logCtx(`Свой признак «${tt || kw}» ×${w}`); recalc(); persist(); draw(); toast('Признак добавлен, оценки пересчитаны'); break; }
    case 'f-reset': S.f = Object.assign({}, FDEF); persist(); drawMain(); drawSide(); break;
    case 'cancel-rej': S.askReject = null; drawMain(); break;
    case 'close': S.drawer = null; drawLayer(); break;
    case 'send-crm':
      S.sending = true; drawMain();
      requestAnimationFrame(() => requestAnimationFrame(() => { const b = document.getElementById('progbar'); if(b) b.style.width = '100%'; }));
      setTimeout(() => { S.sending = false; S.crmSent = true; drawMain(); drawSide(); persist(); toast('Готово: очередь в CRM (демо)'); }, 1500);
      break;
    case 'dl-csv': saveFile('povod-iek-kontragenty.csv', '﻿' + toCSV(queueList(), ';'), 'text/csv'); break;
    case 'copy-tsv': copy(toCSV(queueList(), '\t'), 'Скопировано. Вставьте в Excel или Таблицы'); break;
    case 'copy-mail': { const m = (byId[S.msgCo].msg || {}).email || {}; copy((m.subj ? 'Тема: ' + m.subj + '\n\n' : '') + (m.body || ''), 'Письмо скопировано'); break; }
    case 'copy-call': copy(scriptOf(byId[S.msgCo]).map(x => x.t).join('\n'), 'Звонок скопирован'); break;
    case 'edit-script': { const c = byId[S.msgCo]; if(!S.scripts[c.id]) S.scripts[c.id] = baseScript(c); S.edit = c.id; drawMain(); break; }
    case 'done-script': S.edit = null; persist(); drawMain(); toast('Сохранено'); break;
    case 'reset-script': delete S.scripts[S.msgCo]; S.edit = null; persist(); drawMain(); break;
    case 'add-step': { const c = byId[S.msgCo]; (S.scripts[c.id] = S.scripts[c.id] || baseScript(c)).push({l:'Свой шаг', t:''}); persist(); drawMain(); break; }
    case 'add-step-all': S.extra.push({l:'Квалификация', t:'Сколько щитов в месяц вы собираете и кто закупает комплектующие?'}); persist(); drawMain(); toast('Шаг добавлен во все карточки'); break;
    case 'ctx-ok': S.ctxOk = true; logCtx('Контекст подтвердили'); persist(); draw(); toast('Контекст подтверждён'); break;
    case 'src-ok': S.srcOk = true; logCtx(`Площадки подтвердили: ${SRC.filter(s => srcOn(s.k)).length + S.srcCustom.length}`); persist(); draw(); toast('Площадки выбраны'); break;
    case 'expert': S.expert = !S.expert; persist(); drawSide(); if(S.expert) toast('Эксперт канала: две встречи по 40 минут. Размечает эталон из 30 карточек, новые правила агент проверяет на нём'); break;

    case 'add-src': { const tt = (document.getElementById('cs-t').value || '').trim(), w = (document.getElementById('cs-w').value || '').trim(); if(!tt){ toast('Впишите площадку или адрес'); break; } S.srcCustom.push({t:tt, w}); logCtx(`Своя площадка «${tt}»${w ? ': ' + w : ''}`); persist(); draw(); toast('Площадка добавлена. В пилоте агент настроит чтение под ваше описание'); break; }

document.addEventListener('change', e => {

  if(t.dataset.f){ S.f[t.dataset.f] = (t.value || '').trim(); persist(); drawMain(); drawSide(); return; }
  if(t.dataset.cmode){ const k = CRIT.find(x => x.k === t.dataset.cmode); if(!k) return; const before = qSnap(); S.cmode[k.k] = t.value; logCtx(`Признак «${k.t}»: ${MODEL[t.value]}`); recalc(); persist(); draw(); toast(`${qMsg(before)}`); return; }
  if(t.dataset.ccm != null){ const k = S.custom[+t.dataset.ccm]; if(!k) return; k.on = t.value !== '0'; if(k.on) k.w = t.value; logCtx(`Свой признак «${k.t}»: ${MODEL[t.value]}`); recalc(); persist(); draw(); return; }
  if(t.dataset.ctxfile && t.files && t.files[0]){ const r = new FileReader(); r.onload = () => { S.ctxMd = String(r.result || '').slice(0, 60000); logCtx('Загрузили свой context.md'); persist(); drawMain(); toast('Контекст загружен. В пилоте агент перестроит отбор по нему'); }; r.readAsText(t.files[0]); return; }
  if(t.id === 'upl' && t.files[0]){
    const r = new FileReader();
    r.onload = () => { const inns = new Set((String(r.result).match(/\b\d{10}\b|\b\d{12}\b/g) || [])); let n = 0; C.forEach(c => { if(c.inn && inns.has(c.inn)){ S.clients.add(c.id); n++; } }); recalc(); draw(); persist(); toast(`В файле ${inns.size} ИНН, совпали с найденными: ${n}`); };
    r.readAsText(t.files[0]); return;
  }
  if(t.dataset.up && t.files[0]){ S.files[t.dataset.up] = t.files[0].name; persist(); draw(); toast('Файл добавлен. В демо отбор уже собран, в пилоте учтём'); return; }
  if(t.dataset.sl != null || t.dataset.xl != null){ persist(); }
});
document.addEventListener('input', e => { const t = e.target; if(!t.dataset) return;
  if(t.id === 'siteIn'){ S.site = t.value; return; }
  if(t.id === 'steerIn'){ S.steerText = t.value; return; }
  if(t.dataset.sl != null){ const c = byId[S.msgCo]; const arr = S.scripts[c.id] = S.scripts[c.id] || baseScript(c); if(arr[+t.dataset.sl]) arr[+t.dataset.sl][t.dataset.sf] = t.value; store.set('scripts', S.scripts); }
  if(t.dataset.xl != null){ if(S.extra[+t.dataset.xl]) S.extra[+t.dataset.xl][t.dataset.xf] = t.value; store.set('extra', S.extra); } });
document.addEventListener('keydown', e => { if(e.key !== 'Escape') return; if(S.rej){ S.rej = null; drawLayer(); return; } if(S.drawer || S.call){ S.drawer = null; S.call = null; drawLayer(); } });
if(S.ready){ S.done = RUN.length; S.cur = RUN.length; S.li = RUN[RUN.length-1].lines.length; S.view = 'ready'; }
draw();
</script>
